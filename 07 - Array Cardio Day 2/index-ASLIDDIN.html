<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 }
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 }
    ];

    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?
    // Array.prototype.every() // is everyone 19 or older?

    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423

    // Array.prototype.findIndex()
    // Find the comment with this ID
    // delete the comment with the ID of 823423

  
const currentYear = new Date().getFullYear();
const someAdults = people.some(person => currentYear-person.year >= 19);
const allAdults = people.every(person => currentYear-person.year >= 19);
const matchingComment = comments.find(comment => comment.id === 823423);
const commentIndex = comments.findIndex(comment => comment.id === 823423);
const remainingComments = [...comments];
if(commentIndex !== -1) remainingComments.splice(commentIndex,1);
const results = {someAdults,allAdults,matchingComment,commentIndex,remainingComments};
console.log(results);

document.body.appendChild(Object.assign(document.createElement('pre'),{textContent:JSON.stringify(results,null,2)}));
</script>
</body>
</html>
